name: DeployMate CI

on:
  push:
    branches:
      - main
      - staging
      - '**'
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Type Check & Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Run type checking
        run: npm run check

      - name: 5. Run linting
        run: npm run lint

      - name: 6. Run tests
        run: npm test

      - name: 7. Generate test coverage
        run: npm run test:coverage
